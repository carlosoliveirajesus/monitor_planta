<script>
  // Tenta pegar as credenciais salvas no navegador
  let username = localStorage.getItem('aio_username');
  let key = localStorage.getItem('aio_key');

  // Se não estiverem salvas, pede ao usuário
  if (!username || !key) {
    username = prompt("Digite seu Adafruit IO Username:");
    key = prompt("Digite sua Adafruit IO Key:");

    if (username && key) {
      localStorage.setItem('aio_username', username);
      localStorage.setItem('aio_key', key);
    } else {
      alert("É necessário preencher as credenciais para conectar!");
    }
  }

  const feedName = 'umidade';
  const host = 'wss://io.adafruit.com:443';
  const topic = `${username}/feeds/${feedName}`;

  const options = {
    username: username,
    password: key,
    clientId: 'Web_Client_' + Math.random().toString(16).substring(2, 10)
  };

  const statusEl = document.getElementById('status-mqtt');
  const umidadeEl = document.getElementById('val-umidade');

  console.log('--- Conectando ao Adafruit IO via WSS ---');
  const client = mqtt.connect(host, options);

  client.on('connect', () => {
    console.log('✅ Conectado ao Adafruit IO!');
    statusEl.innerText = '● Conectado em tempo real';
    statusEl.style.color = '#2e7d32';

    client.subscribe(topic, (err) => {
      if (!err) {
        console.log(`✅ Inscrito no feed: ${topic}`);
      }
    });
  });

  client.on('message', (t, message) => {
    const valorStr = message.toString();
    console.log('📩 Novo valor de umidade recebido:', valorStr);
    umidadeEl.innerText = valorStr;
  });

  client.on('error', (err) => {
    console.error('❌ Erro MQTT:', err);
    statusEl.innerText = 'Erro na Conexão / Credenciais Inválidas';
    statusEl.style.color = '#d32f2f';
  });
</script>
